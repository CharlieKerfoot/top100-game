<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Coin background -->
  <circle cx="16" cy="16" r="15" fill="#1a1a1a"/>
  <!-- Coin ring -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="#c4a052" stroke-width="1.5"/>
  <!-- Inner ring -->
  <circle cx="16" cy="16" r="12" fill="none" stroke="#c4a052" stroke-width="0.5" opacity="0.5"/>
  <!-- Cent symbol -->
  <text
    x="16"
    y="21.5"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="18"
    font-weight="700"
    fill="#f0d080"
  >¢</text>
</svg>
