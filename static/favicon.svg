<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Penny: copper coin with cent symbol -->
  <circle cx="16" cy="16" r="15" fill="#c4956a"/>
  <circle cx="16" cy="16" r="14" fill="none" stroke="#8b5e3c" stroke-width="1"/>
  <circle cx="16" cy="16" r="11.5" fill="none" stroke="#8b5e3c" stroke-width="0.5" opacity="0.6"/>
  <!-- Cent symbol as path (no text element for favicon compatibility) -->
  <!-- C shape -->
  <path d="M20.5 12.5 A6 6 0 1 0 20.5 21.5" fill="none" stroke="#3d2b1f" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Vertical bar through the C -->
  <line x1="16.5" y1="8" x2="16.5" y2="26" stroke="#3d2b1f" stroke-width="1.8" stroke-linecap="round"/>
</svg>
