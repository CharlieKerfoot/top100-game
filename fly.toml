# fly.toml app configuration file generated for top100-game on 2026-04-10T05:47:16Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#


app = 'top100-game'
primary_region = 'ord'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[mounts]
  source = 'data'
  destination = '/data'

[env]
  DATA_DIR = '/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
